spring.application.name=auth-service-test

# Disable Eureka in tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# In-memory H2 DB for testing
spring.datasource.url=jdbc:h2:mem:bawaba_auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# RSA Key Paths
jwt.private-key-path=/home/hatim/projects/Bawaba/key/private.key
jwt.public-key-path=/home/hatim/projects/Bawaba/key/public.key

# Expirations
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Cookie Configuration
jwt.cookie.access-token-name=access_token
jwt.cookie.refresh-token-name=refresh_token
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
