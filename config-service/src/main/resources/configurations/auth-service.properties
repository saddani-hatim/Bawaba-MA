server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bawaba_auth}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RSA Key Paths
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:/home/hatim/projects/Bawaba/key/private.key}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:/home/hatim/projects/Bawaba/key/public.key}

# Expirations (Access: 15 min = 900000 ms, Refresh: 7 days = 604800000 ms)
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Cookie Configuration
jwt.cookie.access-token-name=access_token
jwt.cookie.refresh-token-name=refresh_token
jwt.cookie.secure=false
jwt.cookie.same-site=Lax